name: Sync Drive and Publish Garden
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync:
    # Never let an unmerged workflow from another branch deploy production.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DRIVE_EXPORT_URL != '') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    outputs:
      changed: ${{ steps.pull.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_drive_sync.py' -v
      - name: Read and validate the authoritative Drive sources
        id: pull
        env:
          DRIVE_EXPORT_URL: ${{ vars.DRIVE_EXPORT_URL }}
        run: python scripts/pull-drive.py --apply
      - uses: actions/setup-node@v6
        if: steps.pull.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Inspect prior full CI evidence
        id: development_ci
        if: steps.pull.outputs.changed == 'true'
        run: node scripts/publication-ci.mjs drive
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Refuse unsafe publication workspace
        if: steps.pull.outputs.changed == 'true' && steps.development_ci.outputs.safe_to_publish != 'true'
        run: exit 1
      - if: steps.pull.outputs.changed == 'true'
        run: npm ci
      - name: "Full: research MCP dependencies"
        if: steps.pull.outputs.changed == 'true' && steps.development_ci.outputs.mode != 'fast'
        run: npm ci --prefix integrations/research-mcp --ignore-scripts --no-audit --no-fund
      - name: "Full: research MCP regression"
        if: steps.pull.outputs.changed == 'true' && steps.development_ci.outputs.mode != 'fast'
        run: npm test --prefix integrations/research-mcp
      - name: "Full: fixture metadata repair"
        if: steps.pull.outputs.changed == 'true' && steps.development_ci.outputs.mode != 'fast'
        run: python -m unittest discover -s tests -p 'test_research_*fixture_metadata_repair.py' -v
      - name: "Full: storage capacity policy"
        if: steps.pull.outputs.changed == 'true' && steps.development_ci.outputs.mode != 'fast'
        run: python -m unittest discover -s tests -p 'test_research_storage_capacity_policy.py' -v
      - name: "Full: Drive regression"
        if: steps.pull.outputs.changed == 'true' && steps.development_ci.outputs.mode != 'fast'
        run: python -m unittest discover -s tests -p 'test_*drive*.py' -v
      - name: "Full: connector snapshot"
        if: steps.pull.outputs.changed == 'true' && steps.development_ci.outputs.mode != 'fast'
        run: python -m unittest discover -s tests -p 'test_connector_snapshot.py' -v
      - name: "Full: WebsiteData export"
        if: steps.pull.outputs.changed == 'true' && steps.development_ci.outputs.mode != 'fast'
        run: python -m unittest discover -s tests -p 'test_export_website_data.py' -v
      - name: "Full: Python dependencies"
        if: steps.pull.outputs.changed == 'true' && steps.development_ci.outputs.mode != 'fast'
        run: python -m pip install trafilatura==2.2.0 markdown-it-py==4.2.0 playwright==1.63.0 PyMuPDF==1.27.2.3
      - name: "Full: PDF context and publisher profiles"
        if: steps.pull.outputs.changed == 'true' && steps.development_ci.outputs.mode != 'fast'
        run: |
          python -m unittest discover -s tests -p 'test_pdf_table_context.py' -v
          PYTHONPATH=tests python -m unittest test_research_worker.WorkerTests.test_pdf_sparse_section_divider_requires_an_exact_profile_match test_research_worker.WorkerTests.test_pdf_profiles_use_native_page_text_and_reject_ambiguous_dates test_research_worker.WorkerTests.test_pdf_publisher_date_normalization_preserves_source_and_rejects_conflicts -v
      - name: "Full: browser dependencies"
        if: steps.pull.outputs.changed == 'true' && steps.development_ci.outputs.mode != 'fast'
        run: python -m playwright install --with-deps chromium
      - name: "Full: garden regression"
        if: steps.pull.outputs.changed == 'true' && steps.development_ci.outputs.mode != 'fast'
        run: npm run test:garden
        env:
          RESEARCH_PYTHON: python
      - name: Validate content and build the site
        if: steps.pull.outputs.changed == 'true'
        run: npm run build
      - name: Verify rendered site
        if: steps.pull.outputs.changed == 'true'
        run: node scripts/verify-site.mjs
      - name: Recheck source after the build
        if: steps.pull.outputs.changed == 'true'
        run: node scripts/publication-ci.mjs check
      - name: Preserve validated Drive changes in GitHub
        if: steps.pull.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- vault/Editions vault/Knowledge vault/Signals vault/TrendTopics vault/Briefings vault/News vault/Trends 'vault/Knowledge Maps' vault/About.md vault/index.md vault/briefing.xml digest data/catalog.json data/article-semantic-review-index.json data/drive-source-state.json
          git diff --cached --quiet || git commit -m 'Sync website source from Google Drive'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        if: steps.pull.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.pull.outputs.changed == 'true'
        with:
          path: public
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
